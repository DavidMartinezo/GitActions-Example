name: multiple jobs

on:
   workflow_dispatch: 
    

  
jobs: 
    job-1: 
      runs-on: ubuntu-latest
      steps: 
      - name: Print Job's name
        run: echo "job 1"

    job-2: 
      runs-on: macos-latest
      steps: 
      - name: Print Job's name
        run: echo "job 2"

    job-3: 
      runs-on: windows-latest
      steps: 
      - name: Print Job's name
        run: echo "job 3"

    job-4: 
     needs: [job-1, job-3]
     runs-on: ubuntu-latest
     steps:
     - name: Prints job's name 
       run: echo "Job 4 in ubuntu"

